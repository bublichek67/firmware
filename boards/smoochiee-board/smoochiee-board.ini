; PlatformIO Project Configuration File под ESP32-S3 N16R8 (ILI9341 + NRF24)

[env:smoochiee-board]
board = esp32-s3-devkitc-1
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = custom_16Mb.csv

build_flags =
    ${env.build_flags}
    -Iboards/smoochiee-board
    -Os
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
       ; --- БЕЗОПАСНЫЕ ЗАГЛУШКИ (ВМЕСТО -1 СТАВИМ ВАЛИДНЫЙ GPIO 0) ---
    -DCC1101_SS_PIN=0
    -DCC1101_GDO0_PIN=0
    -DCC1101_GDO2_PIN=0
    -DBUTTON_UP_PIN=0
    -DBUTTON_DOWN_PIN=0
    -DBUTTON_LEFT_PIN=0
    -DBUTTON_RIGHT_PIN=0
    -DBUTTON_ACT_PIN=0
    -DPMIC_INT_PIN=0
    -DSDA=47
    -DSCL=48
    -DBUZZ_PIN=44
    -DUSE_HSPI_PORT=1
    -DDEVICE_NAME='"Smoochiee Board"'
    -include boards/smoochiee-board/pins_arduino.h

    

