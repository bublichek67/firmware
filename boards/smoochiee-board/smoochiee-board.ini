; PlatformIO Project Configuration File под ESP32-S3 N16R8 (ILI9341 + NRF24)

[env:smoochiee-board]
board = esp32-s3-devkitc-1
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = custom_16Mb.csv

build_flags =
    ${env.build_flags}
    -Iboards/smoochiee-board
    -Os
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    
    ; --- АВАРИЙНЫЙ USB ПОРТ И МАКСИМАЛЬНЫЙ ДЕБАГ ---
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    ; --- ЗАГЛУШКИ ДЛЯ ОТКЛЮЧЕННОЙ ПЕРИФЕРИИ ---
    -DCC1101_SS_PIN=-1
    -DCC1101_GDO0_PIN=-1
    -DCC1101_GDO2_PIN=-1
    -DBUTTON_UP_PIN=-1
    -DBUTTON_DOWN_PIN=-1
    -DBUTTON_LEFT_PIN=-1
    -DBUTTON_RIGHT_PIN=-1
    -DBUTTON_ACT_PIN=-1
    -DPMIC_INT_PIN=-1
    
    ; --- БАЗОВЫЕ НАСТРОЙКИ ---
    -DSDA=47
    -DSCL=48
    -DBUZZ_PIN=44
    -DUSE_HSPI_PORT=1
    -DDEVICE_NAME='"Smoochiee Board"'
    

