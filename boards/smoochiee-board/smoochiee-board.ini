; PlatformIO Project Configuration File под ESP32-S3 N16R8 (ILI9341 + NRF24)

[env:smoochiee-board]
; Указываем базовую плату, которую понимает PlatformIO для S3 чипов
board = esp32-s3-devkitc-1

build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>

; Настройки для твоей памяти N16R8 (16MB Flash, 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = custom_16Mb.csv

build_flags =
	${env.build_flags}
	-Iboards/smoochiee-board
	-Os
	-DCORE_DEBUG_LEVEL=1
	
	; ОБЯЗАТЕЛЬНО: Активируем PSRAM в коде, чтобы плата не уходила в bootloop
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_MODE_OCT=1
	
	; Настройки пинов периферии
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DMIC_INMP441
	-DBUZZ_PIN=44
	-D USE_HSPI_PORT=1
	-DDEVICE_NAME='"Smoochiee Board"'

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0

